<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pré‑inscription Handfit</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color:#1a237e;
            padding:10px 20px;
            display:flex;
            align-items:center;
        }
        header img {
            height:80px;
            width:auto;
            margin-right:25px;
        }
        nav a {
            color:white;
            text-decoration:none;
            font-size:18px;
            margin-right:25px;
        }
        .content {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        h1 {
            color:#1a237e;
        }
        .form-handfit {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .form-handfit input,
        .form-handfit textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn {
            padding: 14px 28px;
            background: #1a237e;
            color: white;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">
        <img src="image/laclichoise.png" alt="Logo La Clichoise Handball">
    </a>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="equipes.html">Équipes</a>
        <a href="calendrier.html">Calendrier</a>
        <a href="resultats.html">Résultats</a>
        <a href="partenaires.html">Partenaires</a>
        <a href="contact.html">Contact</a>
        <a href="handfit.html"><strong>Handfit</strong></a>
    </nav>
</header>

<div class="content">
    <h1>Pré‑inscription Handfit</h1>

    <form action="https://formspree.io/f/maqznowo" method="POST" class="form-handfit">

        <label>Nom :</label>
        <input type="text" name="nom" required>

        <label>Prénom :</label>
        <input type="text" name="prenom" required>

        <label>Email :</label>
        <input type="email" name="email" required>

        <label>Téléphone :</label>
        <input type="tel" name="telephone" required>

        <label>Objectif personnel :</label>
        <textarea name="objectif" rows="4"></textarea>

        <button type="submit" class="btn">Envoyer</button>
    </form>
</div>

</body>
</html>
