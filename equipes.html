<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nos Équipes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .categorie {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .categorie img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .categorie h2 {
            margin: 0;
            color: #222;
        }
    </style>
</head>
<body>

    <h1>Nos Équipes</h1>

    <div class="categories">

        <div class="categorie">
            <img src="image/u9.jpg" alt="Équipe U9">
            <h2>U9 – Mini Hand</h2>
        </div>
